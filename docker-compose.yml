services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cdrl}
      POSTGRES_USER: ${POSTGRES_USER:-cdrl_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe definirse fuera del repositorio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Docker crea el volumen vacio como root; prepara permisos para UID 1000,
  # que es el usuario predeterminado de DynamoDB Local.
  dynamodb-init:
    image: amazon/dynamodb-local:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /home/dynamodblocal/data"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  dynamodb_data:
