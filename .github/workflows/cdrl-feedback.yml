name: CDRL feedback

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: cdrl_dev
      POSTGRES_PASSWORD: "ci-${{ github.run_id }}"
      POSTGRES_DB: cdrl
      POSTGRES_PORT: 5433
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Preparar entorno reproducible
        shell: bash
        run: |
          set -euo pipefail
          make setup
      - name: Comprobar setup idempotente
        shell: bash
        run: |
          set -euo pipefail
          make setup
      - name: Verify reproducibility contract
        shell: bash
        run: |
          set -euo pipefail
          make verify
      - name: Detener servicios
        if: always()
        run: |
          docker compose down