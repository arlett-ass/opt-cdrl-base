name: M09 auditoria Angelica

on:
  pull_request:
    paths:
      - 'src/m09/**'
      - 'tests/test_m09_security_audit.py'
      - 'tests/test_m09_abuse.py'
      - 'tests/fixtures/m09_security_cases.json'
      - '.github/workflows/m09-audit-angelica.yml'
  push:
    branches:
      - feat/m09-audit-angelica
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: cdrl_dev
      POSTGRES_PASSWORD: "ci-${{ github.run_id }}"
      POSTGRES_DB: cdrl
      POSTGRES_PORT: 5433
      DYNAMODB_LOCAL: "true"
      DYNAMODB_PORT: "8000"
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Preparar entorno limpio
        run: make setup
      - name: Pruebas de auditoria y abuso M09
        run: python -m pytest tests/test_m09_security_audit.py tests/test_m09_abuse.py -v
      - name: Regresiones M01-M08
        run: make verify
      - name: Detener servicios
        if: always()
        run: docker compose down
